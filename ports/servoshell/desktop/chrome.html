<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Armature</title>
<style>
  :root { color-scheme: dark; font: 14px system-ui, sans-serif; background: #161a23; color: #f3f4f9; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 8px; }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  #navigation { margin-bottom: 0; }
  .tabs-left #tab-row { position: absolute; top: 0; bottom: 0; left: 0; width: 190px; padding: 8px; flex-direction: column; align-items: stretch; border-right: 1px solid #383f50; margin: 0; }
  .tabs-left #tabs { flex-direction: column; }
  .tabs-left .tab { flex: none; }
  .tabs-left #navigation, .tabs-left #panel { margin-left: 190px; }
  #tabs { display: flex; gap: 4px; min-width: 0; overflow: auto; flex: 1; }
  .tab { display: flex; flex: 0 1 190px; min-width: 60px; background: #232937; border-radius: 7px; }
  .tab.active { background: #3b4661; }
  .tab button:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  button, input { font: inherit; color: inherit; border: 1px solid transparent; border-radius: 6px; height: 28px; }
  button { padding: 0 8px; background: #232937; cursor: pointer; }
  .tab button { background: transparent; }
  button:hover { background: #495775; }
  button:disabled { opacity: .4; cursor: default; }
  input { background: #10141b; border-color: #384258; padding: 0 8px; min-width: 0; }
  input:focus, button:focus-visible { outline: 2px solid #93b8ff; outline-offset: -2px; }
  #address { flex: 1; }
  .tool { flex: none; width: 32px; padding: 4px; display: grid; place-items: center; }
  .tool svg { width: 19px; height: 19px; }
  #menu svg { width: 22px; height: 22px; }
  .tool[aria-expanded="true"], .actions button[aria-pressed="true"] { background: #3b4661; }
  #panel { margin-top: 8px; background: #232937; border-radius: 7px; padding: 8px; max-height: 160px; overflow: auto; }
  #panel h2 { font-size: 14px; margin: 0 0 5px; }
  #panel p { margin: 4px 0 8px; }
  .entry { display: block; width: 100%; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .tool[hidden] { display: none; }
  #bookmark[aria-pressed="true"] svg { fill: currentColor; }
  #downloads[data-active="true"] { color: #a8c9ff; }
  #downloads[data-active="true"] .arrow { animation: transfer 1.1s ease-in-out infinite; }
  @keyframes transfer { 0%, 55%, 100% { transform: translateY(0); } 25% { transform: translateY(3px); } }
  @media (prefers-reduced-motion: reduce) { #downloads .arrow { animation: none !important; } }
</style>
<div class="row" id="tab-row">
  <div id="tabs" aria-label="Tabs"></div>
  <button id="newTab" aria-label="New tab">+</button>
</div>
<form class="row" id="navigation">
  <button type="button" class="tool" id="back" aria-label="Back" title="Back"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m19 8-8 8 8 8"/></svg></button>
  <button type="button" class="tool" id="forward" aria-label="Forward" title="Forward"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m13 8 8 8-8 8"/></svg></button>
  <button type="button" class="tool" id="reload" aria-label="Reload" title="Reload"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M24 12a9 9 0 1 0 1 8m0-14v7h-7"/></svg></button>
  <button type="button" class="tool" id="site" aria-label="Site controls" title="Site controls"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v22m8-22v22m8-22v22M5 12h6m2 9h6m2-10h6"/></svg></button>
  <input id="address" aria-label="Search or enter an address" autocomplete="off" placeholder="Search or enter an address" spellcheck="false">
  <button type="button" class="tool" id="bookmark" aria-label="Bookmark this page" title="Bookmark this page" aria-pressed="false" disabled><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m16 4 3.7 7.6 8.3 1.2-6 5.9 1.4 8.3-7.4-4-7.4 4 1.4-8.3-6-5.9 8.3-1.2z"/></svg></button>
  <button type="button" class="tool" id="downloads" hidden aria-label="Downloads" title="Downloads"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path class="arrow" d="M16 5v15m-6-6 6 6 6-6"/><path d="M6 22v5h20v-5"/></svg></button>
  <button type="button" class="tool" id="menu" aria-label="Armature menu" title="Armature menu"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path stroke-width="3.2" stroke-linecap="butt" d="M26 26H15a11 11 0 1 1 13-11v2a3.25 3.25 0 0 1-6.5 0v-3c0-4-5-5-9-3"/><path stroke-width="2.35" d="M21.5 16h-5c-5.5 0-5.5 5.5-1 5.5h1c2 0 4-1 5-2.5"/></svg></button>
</form>
<section id="panel" aria-label="Browser controls" hidden></section>
<script>
  "use strict";
  const byId = id => document.getElementById(id);
  const send = (op, params = {}) => console.log("armature-chrome:" + JSON.stringify({op, ...params}));
  const pending = new Map();
  let nextId = 0;
  function request(op, params) {
    return new Promise((resolve, reject) => {
      const id = ++nextId;
      const timeout = setTimeout(() => {
        pending.delete(id);
        reject(new Error("The browser did not reply"));
      }, 10000);
      pending.set(id, {resolve, reject, timeout});
      send(op, {id, ...params});
    });
  }
  window.finishChromeRequest = ({id, result, error}) => {
    const entry = pending.get(id);
    if (!entry) return;
    pending.delete(id);
    clearTimeout(entry.timeout);
    if (error) entry.reject(new Error(error));
    else entry.resolve(result);
  };
  let tabSnapshot = Object.freeze([]);
  window.armature = Object.freeze({
    tabs: () => tabSnapshot,
    queryDOM: (target, selector, fields = ["text", "html", "value", "attributes"]) =>
      request("queryDOM", {target, selector, fields}),
    mutateDOM: (target, operations) => request("mutateDOM", {target, operations}),
    evaluateScript: (target, script, args = []) => request("evaluateScript", {target, script, args}),
  });

  const address = byId("address");
  let editingAddress = false;
  address.onblur = () => {
    editingAddress = false;
    address.value = addressText(displayedURL);
  };
  address.oninput = () => { editingAddress = true; };
  const addressText = url => url === "servo:newtab" ? "" : url ?? "";
  let displayedTab;
  let displayedURL;
  window.updateChrome = tabs => {
    tabSnapshot = Object.freeze(tabs.map(tab => Object.freeze(tab)));
    const active = tabs.find(tab => tab.active);
    const tabList = byId("tabs");
    tabList.replaceChildren();
    for (const tab of tabs) {
      const label = tab.title || tab.url || "New tab";
      const group = document.createElement("div");
      group.className = tab.active ? "tab active" : "tab";
      const open = document.createElement("button");
      open.textContent = (tab.loading ? "◌ " : "") + label;
      open.title = label;
      open.setAttribute("aria-pressed", String(tab.active));
      open.onclick = () => send("selectTab", {tab: tab.id});
      const close = document.createElement("button");
      close.textContent = "×";
      close.setAttribute("aria-label", "Close " + label);
      close.onclick = () => send("closeTab", {tab: tab.id});
      group.append(open, close);
      tabList.append(group);
    }
    byId("back").disabled = !active?.back;
    byId("forward").disabled = !active?.forward;
    byId("reload").disabled = !active;
    if (active?.id !== displayedTab || active?.url !== displayedURL) {
      if (active?.id !== displayedTab) editingAddress = false;
      displayedTab = active?.id;
      displayedURL = active?.url;
      if (!editingAddress) address.value = addressText(displayedURL);
    }
  };
  for (const op of ["newTab", "back", "forward", "reload"]) byId(op).onclick = () => send(op);
  byId("navigation").onsubmit = event => {
    event.preventDefault();
    const input = address.value.trim();
    if (!input) return;
    editingAddress = false;
    address.blur();
    send("navigate", {url: input});
  };
  byId("bookmark").onclick = () => send("bookmark");
  const tools = ["site", "downloads", "menu"];
  const panel = byId("panel");
  let openPanel = "";
  let browser = {};
  let downloadAddress = "";
  const make = (tag, text) => {
    const element = document.createElement(tag);
    element.textContent = text;
    return element;
  };
  function action(label, run, parent = panel) {
    const button = make("button", label);
    button.type = "button";
    button.onclick = run;
    parent.append(button);
    return button;
  }
  function entries(items, empty) {
    if (!items?.length) panel.append(make("p", empty));
    for (const entry of items ?? []) {
      const button = action(entry.title || entry.url, () => {
        showPanel("");
        send("navigate", {url: entry.url});
      });
      button.className = "entry";
      button.title = entry.url;
    }
  }
  function reportPanel() {
    send("panel", {height: openPanel ? Math.ceil(panel.getBoundingClientRect().height) + 10 : 0});
  }
  function renderPanel() {
    panel.replaceChildren();
    if (!openPanel) { reportPanel(); return; }
    const tab = tabSnapshot.find(tab => tab.active);
    const label = {site:"Site controls",history:"History",bookmarks:"Bookmarks",downloads:"Downloads",menu:"Armature",settings:"Settings",find:"Find in page",switcher:"Open tabs"};
    panel.append(make("h2", label[openPanel]));
    const actions = make("div", "");
    actions.className = "actions";
    switch (openPanel) {
      case "site":
        panel.append(make("p", browser.origin || "Browser page"));
        panel.append(make("p", browser.scheme === "http" ? "This page uses an unencrypted HTTP connection." :
          browser.scheme === "https" ? "This page uses an HTTPS address." : "No web connection for this page."));
        break;
      case "history":
        entries(browser.history, "No pages in history.");
        break;
      case "bookmarks":
        if (tab && browser.origin) action(browser.bookmarked ? "Remove bookmark" : "Bookmark this page", () => send("bookmark"));
        entries(browser.bookmarks, "No bookmarks yet.");
        break;
      case "downloads":
        if (!browser.downloads?.length) panel.append(make("p", "No downloads."));
        for (const transfer of browser.downloads ?? []) {
          panel.append(make("p", transfer.name + " · " + transfer.status));
          if (transfer.url && !transfer.active && transfer.status.startsWith("Failed:")) {
            action("Retry " + transfer.name, () => send("download", {url:transfer.url}));
          }
        }
        panel.append(actions);
        const urlField = make("input", "");
        urlField.type = "url";
        urlField.value = downloadAddress;
        urlField.oninput = () => { downloadAddress = urlField.value; };
        urlField.placeholder = "https://example.com/file";
        urlField.setAttribute("aria-label", "Download URL");
        actions.append(urlField);
        action("Download file", () => {
          if (!/^https?:\/\//i.test(urlField.value)) {
            urlField.setCustomValidity("Enter an HTTP or HTTPS address.");
            urlField.reportValidity();
            urlField.setCustomValidity("");
          } else if (urlField.reportValidity()) {
            send("download", {url:urlField.value});
            downloadAddress = "";
            urlField.value = "";
          }
        }, actions);
        if (tab) action("Save page as HTML", () => send("savePage"), actions);
        break;
      case "menu":
        panel.append(actions);
        for (const [name, text] of [["history", "History"], ["bookmarks", "Bookmarks"], ["downloads", "Downloads"], ["settings", "Settings"]]) {
          action(text, () => showPanel(name), actions);
        }
        action("Find in page", () => showPanel("find"), actions);
        action("Switch tab", () => showPanel("switcher"), actions);
        if (browser.canRestore) action("Restore previous tabs", () => { showPanel(""); send("restoreTabs"); }, actions);
        if (browser.canReopen) action("Reopen closed tab", () => { showPanel(""); send("reopenTab"); }, actions);
        action("Fullscreen (F11)", () => { showPanel(""); send("fullscreen"); }, actions);
        break;
      case "settings":
        panel.append(make("p", "Tab placement"));
        panel.append(actions);
        for (const [left, text] of [[false,"Tabs on top"],[true,"Tabs on left"]]) {
          const option = action(text, () => send("tabPlacement", {left}), actions);
          option.setAttribute("aria-pressed", String(left === Boolean(browser.tabsLeft)));
        }
        action("Browser preferences", () => { showPanel(""); send("navigate", {url:"servo:preferences"}); });
        break;
      case "find": {
        panel.append(actions);
        const field = make("input", "");
        field.setAttribute("aria-label", "Find text");
        field.placeholder = "Find in page";
        actions.append(field);
        const find = backward => send("find", {text:field.value, backward});
        action("Previous", () => find(true), actions);
        action("Next", () => find(false), actions);
        field.onkeydown = event => { if (event.key === "Enter") find(event.shiftKey); };
        field.focus();
        break;
      }
      case "switcher": {
        const search = make("input", "");
        search.type = "search";
        search.setAttribute("aria-label", "Search tabs");
        search.placeholder = "Search tabs";
        const list = make("div", "");
        panel.append(search, list);
        const open = view => {
          showPanel("");
          send("selectTab", {tab:view.id});
        };
        function updateMatches() {
          const query = search.value.toLowerCase();
          const matches = tabSnapshot.filter(tab =>
            `${tab.title || ""} ${tab.url || ""}`.toLowerCase().includes(query));
          list.replaceChildren();
          for (const view of matches) {
            action(view.title || view.url || "New tab", () => open(view), list).className = "entry";
          }
          if (matches.length === 0) list.append(make("p", "No matching tabs."));
          reportPanel();
          return matches[0];
        }
        search.oninput = updateMatches;
        search.onkeydown = event => {
          if (event.key === "Enter") {
            const match = updateMatches();
            if (match) open(match);
          }
        };
        updateMatches();
        search.focus();
        break;
      }
    }
    reportPanel();
  }
  function showPanel(name) {
    openPanel = name;
    panel.hidden = !name;
    for (const id of tools) byId(id).setAttribute("aria-expanded",
      String(id === name || (id === "menu" && ["history", "bookmarks", "downloads", "settings", "find", "switcher"].includes(name))));
    renderPanel();

  }
  for (const id of tools) {
    byId(id).setAttribute("aria-controls", "panel");
    byId(id).setAttribute("aria-expanded", "false");
    byId(id).onclick = () => showPanel(openPanel === id ? "" : id);
  }
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && document.activeElement === address) {
      event.preventDefault();
      editingAddress = false;
      address.value = addressText(displayedURL);
      address.blur();
      send("focusPage");
    } else if (event.key === "Escape" && openPanel) {
      event.preventDefault();
      showPanel("");
    }
  });
  window.updateBrowser = state => {
    browser = state;
    document.body.classList.toggle("tabs-left", Boolean(state.tabsLeft));
    const downloading = (state.downloads ?? []).some(transfer => transfer.active);
    const bookmark = byId("bookmark");
    bookmark.disabled = !state.origin;
    bookmark.setAttribute("aria-pressed", String(Boolean(state.bookmarked)));
    bookmark.title = state.bookmarked ? "Remove bookmark" : "Bookmark this page";
    byId("downloads").hidden = !state.downloads?.length;
    byId("downloads").dataset.active = String(downloading);
    const label = downloading ? "Downloads, transfer active" : "Downloads";
    byId("downloads").setAttribute("aria-label", label);
    byId("downloads").title = label;
    if (openPanel && !["find", "switcher"].includes(openPanel)) renderPanel();
  };
  window.addEventListener("resize", reportPanel);
  window.openBrowserPanel = showPanel;
  window.focusAddress = () => {
    if (openPanel) showPanel("");
    address.focus();
    address.select();
  };
  send("ready");
</script>
</html>
