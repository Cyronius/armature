<!doctype html>
<html class="reftest-wait">
<title>Continuous SVG fill animation updates the rendered image before its end</title>
<link rel="help" href="https://w3c.github.io/svgwg/specs/animations/#AnimateElement">
<link rel="match" href="../struct/reftests/reference/green-100x100.html">
<script src="/common/reftest-wait.js"></script>
<svg width="100" height="100">
  <rect width="100" height="100" fill="red">
    <animate attributeName="fill" values="red;green;green"
             keyTimes="0;0.01;1" dur="10s" fill="freeze"/>
  </rect>
</svg>
<script>
const timer = setInterval(() => {
  clearInterval(timer);
  document.querySelector("svg").pauseAnimations();
  takeScreenshot();
}, 300);
</script>
