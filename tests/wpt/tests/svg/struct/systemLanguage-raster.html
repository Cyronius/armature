<!doctype html>
<title>SVG systemLanguage controls rasterized image content</title>
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/struct.html#ConditionalProcessingSystemLanguageAttribute">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>
promise_test(async () => {
  const language = navigator.language;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="10">
    <rect width="10" height="10" fill="red" systemLanguage="x-nonexistent"/>
    <rect x="10" width="10" height="10" fill="green" systemLanguage="${language}"/>
    <switch>
      <rect x="20" width="10" height="10" fill="red" systemLanguage="x-nonexistent"/>
      <rect x="20" width="10" height="10" fill="blue" systemLanguage="${language}"/>
    </switch>
  </svg>`;
  const image = new Image();
  const loaded = new Promise((resolve, reject) => {
    image.onload = resolve;
    image.onerror = reject;
  });
  image.src = "data:image/svg+xml," + encodeURIComponent(svg);
  await loaded;

  const canvas = document.createElement("canvas");
  canvas.width = 30;
  canvas.height = 10;
  const context = canvas.getContext("2d");
  context.drawImage(image, 0, 0);
  const pixel = x => Array.from(context.getImageData(x, 5, 1, 1).data);
  assert_array_equals(pixel(2), [0, 0, 0, 0], "nonmatching language is not painted");
  assert_array_equals(pixel(12), [0, 128, 0, 255], "matching language is painted");
  assert_array_equals(pixel(22), [0, 0, 255, 255], "switch paints its first matching child");
}, "SVG image rendering uses the browser language for conditional processing");
</script>
