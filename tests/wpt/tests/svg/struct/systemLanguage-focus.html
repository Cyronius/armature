<!doctype html>
<title>SVG systemLanguage excludes nonmatching elements from focus</title>
<link rel="help" href="https://w3c.github.io/svgwg/svg2-draft/struct.html#ConditionalProcessingSystemLanguageAttribute">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<svg width="30" height="10">
  <rect id="nonmatching" width="10" height="10" tabindex="0" systemLanguage="x-nonexistent"></rect>
  <rect id="matching" x="10" width="10" height="10" tabindex="0"></rect>
  <switch>
    <rect id="unselected" x="20" width="10" height="10" tabindex="0"></rect>
    <rect id="selected" x="20" width="10" height="10" tabindex="0"></rect>
  </switch>
</svg>
<script>
document.getElementById("matching").setAttribute("systemLanguage", navigator.language);
document.getElementById("unselected").setAttribute("systemLanguage", "x-nonexistent");
document.getElementById("selected").setAttribute("systemLanguage", navigator.language);

test(() => {
  const element = document.getElementById("nonmatching");
  element.focus();
  assert_not_equals(document.activeElement, element);
}, "A nonmatching SVG element is not focusable");

test(() => {
  const element = document.getElementById("matching");
  element.focus();
  assert_equals(document.activeElement, element);
}, "A matching SVG element is focusable");

test(() => {
  const element = document.getElementById("unselected");
  element.focus();
  assert_not_equals(document.activeElement, element);
}, "An unselected switch child is not focusable");

test(() => {
  const element = document.getElementById("selected");
  element.focus();
  assert_equals(document.activeElement, element);
}, "A selected switch child is focusable");
</script>
