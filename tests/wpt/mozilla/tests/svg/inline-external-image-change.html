<!doctype html>
<html class="reftest-wait">
<head>
<title>Inline SVG repaints when an external image URL changes</title>
<link rel="match" href="inline-external-image-ref.html">
<style>body { margin: 0 }</style>
</head>
<body>
<svg width="100" height="50" xmlns="http://www.w3.org/2000/svg">
  <image id="image" href="/images/red.png" width="100" height="50"/>
</svg>
<script>
  const image = document.querySelector("#image");
  let loads = 0;
  image.addEventListener("load", () => {
    if (++loads === 1) {
      image.setAttribute("href", "/images/green.png");
    } else {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        document.documentElement.classList.remove("reftest-wait");
      }));
    }
  });
</script>
</body>
</html>
