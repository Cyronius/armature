<!doctype html>
<title>Client rectangles for SVG graphics elements</title>
<link rel="help" href="https://drafts.csswg.org/cssom-view/#dom-element-getclientrects">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<svg style="position:absolute;left:20px;top:30px;width:200px;height:100px"
     viewBox="0 0 100 50">
  <rect id="visible" x="10" y="5" width="20" height="10"/>
  <rect id="hidden" x="10" y="5" width="20" height="10" display="none"/>
</svg>
<script>
test(() => {
  const rect = document.getElementById('visible');
  const boxes = rect.getClientRects();
  assert_equals(boxes.length, 1);
  for (const box of [boxes[0], rect.getBoundingClientRect()]) {
    assert_equals(box.x, 40);
    assert_equals(box.y, 40);
    assert_equals(box.width, 40);
    assert_equals(box.height, 20);
  }
}, 'SVG graphics client rectangles include the viewBox and viewport transforms');

test(() => {
  const rect = document.getElementById('hidden');
  assert_equals(rect.getClientRects().length, 0);
  assert_equals(rect.getBoundingClientRect().width, 0);
}, 'SVG graphics hidden by display have no client rectangles');
</script>
