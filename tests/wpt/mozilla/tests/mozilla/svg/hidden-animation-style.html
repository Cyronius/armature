<!doctype html>
<title>SMIL styling in a hidden SVG subtree</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<svg id="root" style="display: none">
  <symbol><rect id="target" fill="red" width="100" height="100">
    <animate attributeName="fill" values="red; green" calcMode="discrete" dur="1ms" fill="freeze"/>
  </rect></symbol>
</svg>
<script>
root.setCurrentTime(1);
test(() => assert_equals(getComputedStyle(target).fill, "rgb(0, 128, 0)"),
     "The frozen SMIL value is computed in a display:none subtree");
</script>
